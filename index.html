  <style>
    /* Critical CSS for Initial Loader */
    body {
      margin: 0;
      background-color: #0a0a0a;
      color: #f8fafc;
    }

    #initial-loader {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #0a0a0a;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }

    .initial-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
    }

    .initial-progress-container {
      width: 200px;
      height: 2px;
      background: rgba(255, 255, 255, 0.1);
      overflow: hidden;
      border-radius: 4px;
    }

    .initial-progress-bar {
      height: 100%;
      background-color: #c5a059;
      width: 0%;
      box-shadow: 0 0 10px #c5a059;
      animation: initial-load 2s cubic-bezier(0.1, 0.4, 0.2, 1) forwards;
    }

    .initial-status {
      font-family: 'Inter', sans-serif;
      font-size: 0.8rem;
      color: rgba(255, 255, 255, 0.5);
      margin-top: 1rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      animation: pulse 1.5s infinite ease-in-out;
    }

    @keyframes initial-load {
      0% {
        width: 0%;
      }

      30% {
        width: 40%;
      }

      70% {
        width: 70%;
      }

      100% {
        width: 99%;
      }
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 0.5;
      }

      50% {
        opacity: 0.8;
      }
    }
  </style>
</head>
